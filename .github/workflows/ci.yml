name: finance-model-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce financial dashboard
        run: |
          python run.py
          python run_ic.py
          python run_unitree.py
      - name: Validate report output
        run: test -s reports/model_results.json && test -s reports/index.html && test -s reports/vrt_ic_decision.json && test -s reports/vrt_ic_dashboard.html && test -s reports/unitree_ic_dashboard.html && test -s reports/ic_portfolio_overview.html
